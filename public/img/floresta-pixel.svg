<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">
  <!-- Céu azul degradê pixel art -->
  <rect width="1200" height="540" fill="#4B9EB8"/>
  <rect y="120" width="1200" height="220" fill="#6BB6C8"/>
  <rect y="220" width="1200" height="140" fill="#92CED8"/>

  <!-- Nuvens pixel art -->
  <g fill="#C8ECEE">
    <rect x="640" y="70" width="140" height="20"/>
    <rect x="620" y="90" width="190" height="24"/>
    <rect x="660" y="54" width="80" height="16"/>
    <rect x="780" y="150" width="150" height="22"/>
    <rect x="750" y="172" width="210" height="22"/>
  </g>

  <!-- Montanhas ao fundo -->
  <polygon points="560,360 880,105 1180,360" fill="#327A78"/>
  <polygon points="880,105 1180,360 980,360" fill="#256264"/>
  <polygon points="430,360 660,185 900,360" fill="#2B6E68"/>

  <!-- Vegetação média e encosta da cachoeira -->
  <rect x="260" y="250" width="940" height="150" fill="#27693B"/>
  <rect x="720" y="235" width="380" height="165" fill="#1D542E"/>

  <!-- Cachoeira pixel art -->
  <rect x="820" y="275" width="110" height="145" fill="#62C2D4"/>
  <rect x="836" y="275" width="22" height="145" fill="#A6E8F2"/>
  <rect x="876" y="275" width="18" height="145" fill="#DDF9FC"/>
  <rect x="908" y="275" width="14" height="145" fill="#9CE0EC"/>
  <!-- Espuma da cachoeira -->
  <rect x="795" y="405" width="160" height="18" fill="#DDF9FC"/>
  <rect x="810" y="395" width="130" height="12" fill="#A6E8F2"/>

  <!-- Lago / Rio inferior -->
  <rect x="180" y="415" width="1020" height="125" fill="#287B94"/>
  <rect x="240" y="435" width="860" height="16" fill="#469FB8"/>
  <rect x="380" y="465" width="640" height="14" fill="#65BBD0"/>
  <rect x="520" y="495" width="420" height="12" fill="#469FB8"/>

  <!-- Pedras e margem esquerda -->
  <rect x="120" y="340" width="290" height="150" fill="#3B4D42"/>
  <rect x="140" y="328" width="220" height="24" fill="#4E6655"/>
  <rect x="150" y="318" width="190" height="16" fill="#3D8E41"/>

  <!-- Tronco e galhos da árvore gigante à esquerda -->
  <rect x="45" y="0" width="115" height="470" fill="#4A2E1B"/>
  <rect x="75" y="0" width="35" height="470" fill="#633F26"/>
  <rect x="150" y="130" width="130" height="32" fill="#4A2E1B"/>
  <rect x="150" y="210" width="175" height="28" fill="#4A2E1B"/>
  <rect x="20" y="445" width="220" height="95" fill="#362112"/>

  <!-- Copa das árvores esquerda e topo -->
  <g fill="#154726">
    <rect x="0" y="0" width="520" height="95"/>
    <rect x="0" y="95" width="420" height="75"/>
    <rect x="180" y="170" width="220" height="65"/>
  </g>
  <g fill="#266E36">
    <rect x="20" y="15" width="440" height="65"/>
    <rect x="190" y="80" width="210" height="65"/>
    <rect x="240" y="150" width="140" height="50"/>
  </g>
  <g fill="#3E9B4F">
    <rect x="160" y="25" width="180" height="35"/>
    <rect x="220" y="95" width="130" height="35"/>
  </g>

  <!-- Árvores e folhagens da direita -->
  <rect x="1085" y="90" width="115" height="450" fill="#3D2616"/>
  <g fill="#154726">
    <rect x="860" y="0" width="340" height="110"/>
    <rect x="940" y="110" width="260" height="110"/>
    <rect x="990" y="220" width="210" height="130"/>
  </g>
  <g fill="#266E36">
    <rect x="900" y="20" width="280" height="75"/>
    <rect x="980" y="120" width="200" height="80"/>
  </g>

  <!-- Arbustos pixel art na base inferior -->
  <g fill="#0E381C">
    <rect x="0" y="475" width="1200" height="65"/>
    <rect x="0" y="450" width="360" height="35"/>
    <rect x="840" y="450" width="360" height="35"/>
  </g>
  <g fill="#266E36">
    <rect x="30" y="465" width="290" height="35"/>
    <rect x="880" y="465" width="290" height="35"/>
    <rect x="380" y="505" width="440" height="35"/>
  </g>
</svg>
