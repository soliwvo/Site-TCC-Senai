<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueceu a Senha | NEXA PLAY</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <header class="navbar-nexa">
    <a href="index.html" class="logo-nexa-play">NEXA PLAY</a>
    <nav class="nav-links">
      <a href="index.html">Início</a>
      <a href="nexaquest.html">NexaQuest</a>
      <a href="acesso.html" id="nav-Acesso-conta" class="ativo">Acesso</a>
      <a href="sobre.html">Sobre</a>
    </nav>
  </header>

  <main class="fundo-grid-magenta">
    <div class="caixa-etapa-preta">

      <!-- PASSO 1: Desktop - 7 -->
      <div id="rec-passo-1" class="etapa-step ativa">
        <div class="etapa-centralizada">
          <h1 class="titulo-caixa-etapa">ESQUECEU A<br>SENHA</h1>

          <div class="campo-figma" style="width: 100%; text-align: left;">
            <label for="rec-email">EMAIL</label>
            <input type="email" id="rec-email" required>
          </div>

          <button type="button" id="btn-rec-1" class="btn-avancar-contorno">AVANÇAR</button>
        </div>
      </div>

      <!-- PASSO 2: Desktop - 8 -->
      <div id="rec-passo-2" class="etapa-step">
        <div class="etapa-centralizada">
          <h2 class="titulo-caixa-etapa">COLOQUE O CÓDIGO<br>ENVIADO PARA SEU<br>EMAIL</h2>

          <div class="campo-figma" style="width: 100%; text-align: left;">
            <label for="rec-codigo">CÓDIGO DE VERIFICAÇÃO</label>
            <input type="text" id="rec-codigo" placeholder="Ex.: 482910" required>
          </div>

          <button type="button" id="btn-rec-2" class="btn-avancar-contorno">AVANÇAR</button>
        </div>
      </div>

      <!-- PASSO 3: Desktop - 12 -->
      <div id="rec-passo-3" class="etapa-step">
        <div class="etapa-centralizada">
          <h2 class="titulo-caixa-etapa">ESQUECEU A SENHA</h2>

          <div class="campo-figma" style="width: 100%; text-align: left;">
            <label for="rec-nova-senha">NOVA SENHA</label>
            <input type="password" id="rec-nova-senha" required>
          </div>

          <div class="campo-figma" style="width: 100%; text-align: left;">
            <label for="rec-repita-senha">REPITA A SENHA</label>
            <input type="password" id="rec-repita-senha" required>
          </div>

          <button type="button" id="btn-rec-3" class="btn-avancar-contorno">AVANÇAR</button>
        </div>
      </div>

      <p id="mensagem" class="msg-feedback"></p>
    </div>
  </main>

  <script src="js/comum.js"></script>
  <script>
    const recEmail = document.getElementById('rec-email');
    const recCodigo = document.getElementById('rec-codigo');
    const recNova = document.getElementById('rec-nova-senha');
    const recRepita = document.getElementById('rec-repita-senha');

    function irParaPassoRec(num) {
      document.querySelectorAll('.etapa-step').forEach((el) => el.classList.remove('ativa'));
      document.getElementById('rec-passo-' + num).classList.add('ativa');
      mostrarMensagem('', '');
    }

    document.getElementById('btn-rec-1').addEventListener('click', () => {
      if (!recEmail.value.trim()) {
        mostrarMensagem('Informe seu e-mail cadastrado.', 'msg-erro');
        return;
      }
      irParaPassoRec(2);
    });

    document.getElementById('btn-rec-2').addEventListener('click', () => {
      if (!recCodigo.value.trim()) {
        mostrarMensagem('Digite o código enviado para o seu e-mail.', 'msg-erro');
        return;
      }
      irParaPassoRec(3);
    });

    document.getElementById('btn-rec-3').addEventListener('click', () => {
      if (!recNova.value || recNova.value !== recRepita.value) {
        mostrarMensagem('As senhas não conferem.', 'msg-erro');
        return;
      }
      mostrarMensagem('Senha redefinida com sucesso! Redirecionando para o login...', 'msg-sucesso');
      setTimeout(() => { window.location.href = 'acesso.html'; }, 1500);
    });
  </script>
</body>
</html>
